appId: ${APP_ID}
---
# Create the custom food "QA Harness Oat Bar" and log it to today's diary.
#
# Lifted out of custom-food-log.yaml so a second scenario can stand on the same
# proven sequence rather than re-deriving it: every trap below cost a green run
# that was doing something else entirely, and a copy would drift the moment one
# of them is fixed. Callers arrive on Home and are left on the Food tab with
# the entry on screen.
#
# The typed values are asserted back out of the database by the calling
# scenario's oracle, so they are load-bearing: change one here and change it
# there.
#
# SELECTORS: qa-env.sh stops the driver from honouring modals, so a sheet does
# NOT hide the screen behind it. Every selector therefore has to be unambiguous
# against the WHOLE tree, background included — which is why the two "Add Food"
# buttons are told apart by an anchor rather than by an index.
#
# The food form's fields are addressed by testID because nothing else tells
# them apart: an empty input exposes only its placeholder, every numeric field
# placeholders "0", and iOS keeps reporting that placeholder after the field is
# filled — so a text selector silently types every value into whichever numeric
# field comes first. `below:` is no better, since it matches the next label
# rather than the field under it.
- tapOn: "Food"
- tapOn:
    text: "Food"
    below: "Create"

# --- define the food --------------------------------------------------------
- extendedWaitUntil:
    visible: "New Food"
    timeout: 30000
# Every field is centred before it is tapped. The driver has no notion of the
# keyboard: a field underneath it still reads as on-screen and 100% visible, so
# the tap goes to whatever key occupies those coordinates. Untreated, tapping
# Calories pressed the keypad's "5" and the calories went into the serving size
# — which then saved as 505212 with the flow green the whole way.
- tapOn:
    id: "food-form-name"
- waitForAnimationToEnd
- inputText: "QA Harness Oat Bar"

- scrollUntilVisible:
    element:
      id: "food-form-servingSize"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "food-form-servingSize"
- waitForAnimationToEnd
- inputText: "50"

- scrollUntilVisible:
    element:
      id: "food-form-calories"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "food-form-calories"
- waitForAnimationToEnd
- inputText: "212"

# Put the keypad away before going for Save. Save is the last thing on this
# form, the numeric keypad covers the bottom third of the screen, and the
# driver cannot see it: a tap on "Save" from here presses whichever digit
# happens to be at those coordinates, so the calories read 2122 and the form
# never saved at all — with the flow still green until the next selector
# missed. `hideKeyboard` is no help ("Couldn't hide the keyboard": the app's
# input accessory is not a standard dismiss action), but the form's ScrollView
# is keyboardShouldPersistTaps="handled", which means any tap the fields do not
# handle dismisses the keyboard. A field's own label is such a tap; centring it
# first is what keeps THAT tap out from under the keypad in turn.
- scrollUntilVisible:
    element: "Fiber (g)"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Fiber (g)"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Save"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Save"

# --- log it -----------------------------------------------------------------
- extendedWaitUntil:
    visible: "Add Food"
    timeout: 30000
- tapOn: "Add Food"
- tapOn: "Search foods..."
- inputText: "QA Harness Oat Bar"
# The saved food comes back under YOUR FOODS with its calories and serving
# appended, so the trailing comma is what tells the result row apart from the
# search box, which now holds the query verbatim.
- extendedWaitUntil:
    visible: "QA Harness Oat Bar, .*"
    timeout: 30000
- tapOn: "QA Harness Oat Bar, .*"

- extendedWaitUntil:
    visible: "Meal"
    timeout: 20000
# The diary behind this sheet has an "Add Food" button of its own, above its
# "Meal" tile; the sheet's button is below both.
- tapOn:
    text: "Add Food"
    below: "Meal"

- extendedWaitUntil:
    visible: "QA Harness Oat Bar.*"
    timeout: 30000
