# === Settings → Workout ======================================================
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Workout"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Workout"
- waitForAnimationToEnd
- takeScreenshot: /Users/jordanmm/fitness/SparkyFitness/qa/run/shots2/61-workout-settings
- tapOn: "Back"

# === Chat ===================================================================
