appId: ${APP_ID}
---
# Second screenshot walk for the UX audit: what the Exercise experience looks
# like AFTER a workout has been generated and finished, plus the configuration
# screens. Asserts nothing; app-logs.mjs is the only oracle. Shots: qa/run/shots2/.
- runFlow: lib/boot.yaml
- runFlow: lib/grant-notifications.yaml

# === generate + run a Push workout quickly ==================================
- tapOn: "Exercise"
- scrollUntilVisible:
    element:
      id: "up-next-card"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: "up-next-card"
- extendedWaitUntil:
    visible: "New workout options"
    timeout: 30000
- tapOn: "New workout options"
- waitForAnimationToEnd
- tapOn:
    id: "action-sheet-item-pick-muscles"
- extendedWaitUntil:
    visible:
      id: "pick-muscles-splits"
    timeout: 30000
- tapOn:
    id: "pick-muscles-split-push"
- extendedWaitUntil:
    visible:
      id: "up-next-start"
    timeout: 90000
- tapOn:
    id: "up-next-start"
- extendedWaitUntil:
    visible:
      id: "header-segment"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: "Complete Set"
- waitForAnimationToEnd
- tapOn: "Complete Set"
- waitForAnimationToEnd
- takeScreenshot: /Users/jordanmm/fitness/SparkyFitness/qa/run/shots2/40-active-two-sets-done
- scrollUntilVisible:
    element: "End Workout"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "End Workout"
- extendedWaitUntil:
    visible: "Keep going"
    timeout: 20000
- tapOn:
    text: "End Workout"
    rightOf: "Keep going"
- extendedWaitUntil:
    visible: "Workout Complete"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: /Users/jordanmm/fitness/SparkyFitness/qa/run/shots2/41-workout-complete
- tapOn: "Save as Preset"
- extendedWaitUntil:
    visible: "New Preset"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: /Users/jordanmm/fitness/SparkyFitness/qa/run/shots2/42-save-as-preset-form
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Start Workout"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: /Users/jordanmm/fitness/SparkyFitness/qa/run/shots2/43-preset-detail
- tapOn: "Back"
- tapOn: "View Workout"
- extendedWaitUntil:
    visible: "Back"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: /Users/jordanmm/fitness/SparkyFitness/qa/run/shots2/44-workout-detail
- tapOn: "Back"
- tapOn: "Done"
- waitForAnimationToEnd
- takeScreenshot: /Users/jordanmm/fitness/SparkyFitness/qa/run/shots2/45-after-done

